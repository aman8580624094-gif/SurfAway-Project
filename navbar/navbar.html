<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/style.css" rel="stylesheet">
<style>
    .box{
        height:200px;
        width:200px;
        border:1px solid;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;

    }
    .flex{
        display:flex;
        justify-content: space-between;
        border:1px solid;
        padding:20px;
    }
</style>
</head>
<body>
    
    <div class="flex">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>
    <div class="flex">
        <div class="box">1</div>
        <div class="box">2</div>
    </div>
    <div class="flex">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">3</div>
    </div>
</body>
</html>
